name: Build and Test

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --solution BigMachines.slnx --configuration Release --no-build --no-restore --verbosity normal
    - name: Publish NativeAOT smoke test
      run: dotnet publish NativeAotTest/NativeAotTest.csproj --configuration Release --runtime linux-x64
    - name: Run NativeAOT smoke test
      run: ./NativeAotTest/bin/Release/net10.0/linux-x64/publish/NativeAotTest
